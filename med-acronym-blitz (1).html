<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Med Acronym Blitz</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.10.0/dist/tabler-icons.min.css"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f4f0;color:#1a1a18;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px}
  #app{width:100%;max-width:520px}
  .card{background:#fff;border:0.5px solid rgba(0,0,0,0.12);border-radius:12px;padding:1.25rem}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border:0.5px solid rgba(0,0,0,0.25);border-radius:8px;background:transparent;color:#1a1a18;font-size:14px;cursor:pointer;transition:background 0.15s;font-family:inherit}
  .btn:hover{background:rgba(0,0,0,0.05)}
  .btn:active{transform:scale(0.98)}
  .btn:disabled{opacity:0.4;cursor:not-allowed}
  .btn-primary{background:#534AB7;border-color:#534AB7;color:#fff}
  .btn-primary:hover{background:#3C3489;border-color:#3C3489}
  .input-field{width:100%;padding:10px 14px;border:0.5px solid rgba(0,0,0,0.2);border-radius:8px;background:#fff;color:#1a1a18;font-size:15px;font-family:inherit}
  .input-field:focus{outline:none;box-shadow:0 0 0 2px #7F77DD44;border-color:#7F77DD}
  .badge{display:inline-block;padding:3px 10px;border-radius:8px;font-size:12px;font-weight:500}
  .badge-clinical{background:#E1F5EE;color:#085041}
  .badge-medcomms{background:#EEEDFE;color:#3C3489}
  .progress-bar{height:6px;background:#f0efe8;border-radius:3px;overflow:hidden;margin:8px 0 16px}
  .progress-fill{height:100%;background:#7F77DD;border-radius:3px;transition:width 0.5s linear}
  .leaderboard-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:0.5px solid rgba(0,0,0,0.08)}
  .leaderboard-row:last-child{border-bottom:none}
  .rank-badge{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;flex-shrink:0}
  .hint-char{display:inline-block;min-width:16px;text-align:center;border-bottom:2px solid rgba(0,0,0,0.15);margin:0 1px;font-size:17px;font-weight:500;color:#1a1a18}
  .hint-char.revealed{color:#534AB7;border-color:#534AB7}
  .timer-ring{width:52px;height:52px;position:relative;flex-shrink:0}
  .timer-ring svg{transform:rotate(-90deg)}
  .timer-num{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:16px;font-weight:500;color:#1a1a18}
  @keyframes flashRed{0%{background:transparent}50%{background:#FCEBEB}100%{background:transparent}}
  .wrong-flash{animation:flashRed 0.4s ease}
  h1{font-size:22px;font-weight:500;margin-bottom:6px}
  h2{font-size:18px;font-weight:500;margin-bottom:6px}
  p{line-height:1.6}
  .muted{font-size:13px;color:#666}
  .gap-sm{gap:8px}
  .flex{display:flex;align-items:center}
  .room-code-display{text-align:center;background:#EEEDFE;border-radius:8px;padding:10px 20px}
  .room-code-display .label{font-size:11px;color:#534AB7;margin-bottom:2px}
  .room-code-display .code{font-size:26px;font-weight:500;color:#26215C;letter-spacing:4px}
  .info-box{padding:10px 14px;background:#f5f4f0;border-radius:8px;font-size:12px;color:#555;line-height:1.5}
  .correct-box{padding:10px 14px;background:#E1F5EE;border-radius:8px}
  .correct-box .label{font-size:13px;font-weight:500;color:#085041;margin-bottom:2px}
  .correct-box .value{font-size:13px;color:#0F6E56}
  .wrong-box{padding:10px 14px;background:#FCEBEB;border-radius:8px}
  .wrong-box .label{font-size:13px;font-weight:500;color:#791F1F;margin-bottom:2px}
  .wrong-box .value{font-size:13px;color:#A32D2D}
  .my-row{background:#f5f4f0;border-radius:8px;padding:8px;margin:-2px -4px}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
const ACRONYMS = [
  {a:"RAAS",e:"Renin-angiotensin-aldosterone system",cat:"clinical"},
  {a:"HFpEF",e:"Heart failure with preserved ejection fraction",cat:"clinical"},
  {a:"SGLT2i",e:"Sodium-glucose cotransporter-2 inhibitor",cat:"clinical"},
  {a:"NSCLC",e:"Non-small cell lung cancer",cat:"clinical"},
  {a:"CLL",e:"Chronic lymphocytic leukaemia",cat:"clinical"},
  {a:"DLBCL",e:"Diffuse large B-cell lymphoma",cat:"clinical"},
  {a:"eGFR",e:"Estimated glomerular filtration rate",cat:"clinical"},
  {a:"NT-proBNP",e:"N-terminal pro-B-type natriuretic peptide",cat:"clinical"},
  {a:"PK/PD",e:"Pharmacokinetics/pharmacodynamics",cat:"clinical"},
  {a:"ADC",e:"Antibody-drug conjugate",cat:"clinical"},
  {a:"EGFRm",e:"Epidermal growth factor receptor mutation",cat:"clinical"},
  {a:"CRRT",e:"Continuous renal replacement therapy",cat:"clinical"},
  {a:"HFrEF",e:"Heart failure with reduced ejection fraction",cat:"clinical"},
  {a:"MCL",e:"Mantle cell lymphoma",cat:"clinical"},
  {a:"VEGF",e:"Vascular endothelial growth factor",cat:"clinical"},
  {a:"T2DM",e:"Type 2 diabetes mellitus",cat:"clinical"},
  {a:"MACE",e:"Major adverse cardiovascular events",cat:"clinical"},
  {a:"OSA",e:"Obstructive sleep apnoea",cat:"clinical"},
  {a:"NAFLD",e:"Non-alcoholic fatty liver disease",cat:"clinical"},
  {a:"COPD",e:"Chronic obstructive pulmonary disease",cat:"clinical"},
  {a:"TNF",e:"Tumour necrosis factor",cat:"clinical"},
  {a:"IL-6",e:"Interleukin-6",cat:"clinical"},
  {a:"JAK",e:"Janus kinase",cat:"clinical"},
  {a:"PD-L1",e:"Programmed death-ligand 1",cat:"clinical"},
  {a:"CAR-T",e:"Chimeric antigen receptor T-cell",cat:"clinical"},
  {a:"RCT",e:"Randomised controlled trial",cat:"medcomms"},
  {a:"NNT",e:"Number needed to treat",cat:"medcomms"},
  {a:"NNH",e:"Number needed to harm",cat:"medcomms"},
  {a:"ITT",e:"Intention-to-treat",cat:"medcomms"},
  {a:"PP",e:"Per protocol",cat:"medcomms"},
  {a:"CI",e:"Confidence interval",cat:"medcomms"},
  {a:"HR",e:"Hazard ratio",cat:"medcomms"},
  {a:"OR",e:"Odds ratio",cat:"medcomms"},
  {a:"PRISMA",e:"Preferred Reporting Items for Systematic Reviews and Meta-Analyses",cat:"medcomms"},
  {a:"CONSORT",e:"Consolidated Standards of Reporting Trials",cat:"medcomms"},
  {a:"ICMJE",e:"International Committee of Medical Journal Editors",cat:"medcomms"},
  {a:"CSR",e:"Clinical study report",cat:"medcomms"},
  {a:"SLR",e:"Systematic literature review",cat:"medcomms"},
  {a:"MSL",e:"Medical science liaison",cat:"medcomms"},
  {a:"KOL",e:"Key opinion leader",cat:"medcomms"},
  {a:"HEOR",e:"Health economics and outcomes research",cat:"medcomms"},
  {a:"PICO",e:"Population, intervention, comparator, outcome",cat:"medcomms"},
  {a:"SmPC",e:"Summary of product characteristics",cat:"medcomms"},
  {a:"PI",e:"Prescribing information",cat:"medcomms"},
  {a:"MedDRA",e:"Medical Dictionary for Regulatory Activities",cat:"medcomms"},
  {a:"SAE",e:"Serious adverse event",cat:"medcomms"},
  {a:"TEAE",e:"Treatment-emergent adverse event",cat:"medcomms"},
  {a:"PV",e:"Pharmacovigilance",cat:"medcomms"},
  {a:"PSUR",e:"Periodic safety update report",cat:"medcomms"},
  {a:"ISS",e:"Integrated summary of safety",cat:"medcomms"},
];

const TOTAL_Q = 15;
const Q_TIME = 20;
const POINTS_BASE = 100;
const POINTS_SPEED_BONUS = 50;

const FB_CONFIG = {
  apiKey: "AIzaSyCh6uXjtqKjkLHWVw0us2vjNmpjW84cetE",
  authDomain: "medical-typing-race-b875f.firebaseapp.com",
  databaseURL: "https://medical-typing-race-b875f-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "medical-typing-race-b875f",
  storageBucket: "medical-typing-race-b875f.firebasestorage.app",
  messagingSenderId: "790977387344",
  appId: "1:790977387344:web:463378ec7e815d08b66a55"
};

let db, roomRef, playersRef, gameRef;
let state = {
  screen:"home", playerName:"", roomCode:"", isHost:false, playerId:null,
  questions:[], currentQ:0, score:0, answered:false,
  timerInterval:null, timeLeft:Q_TIME, revealedChars:0, players:{}
};

function $(id){return document.getElementById(id)}
function app(){return $("app")}
function shuffle(arr){return [...arr].sort(()=>Math.random()-0.5)}

function generateQuestions(){
  const half = Math.ceil(TOTAL_Q/2);
  const clinical = shuffle(ACRONYMS.filter(a=>a.cat==="clinical")).slice(0, half);
  const medcomms = shuffle(ACRONYMS.filter(a=>a.cat==="medcomms")).slice(0, TOTAL_Q - half);
  return shuffle([...clinical,...medcomms]);
}

function generateRoom(){return Math.random().toString(36).substr(2,5).toUpperCase()}

function normalise(str){return str.trim().toLowerCase().replace(/[^a-z0-9\s\/\-]/g,"")}

function checkAnswer(input, expected){
  const ni = normalise(input), ne = normalise(expected);
  if(ni === ne) return true;
  const iWords = ni.split(/[\s\/]+/), eWords = ne.split(/[\s\/]+/);
  if(iWords.length !== eWords.length) return false;
  return iWords.every((w,i) => eWords[i].startsWith(w) || w === eWords[i]);
}

function timerArc(timeLeft){
  const pct = timeLeft/Q_TIME;
  const r=22,cx=26,cy=26,circ=2*Math.PI*r;
  const dash = circ*pct;
  const col = pct>0.5?"#7F77DD":pct>0.25?"#EF9F27":"#E24B4A";
  return `<svg width="52" height="52" viewBox="0 0 52 52" style="transform:rotate(-90deg)"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#e8e8e4" stroke-width="4"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${col}" stroke-width="4" stroke-dasharray="${dash} ${circ}" stroke-linecap="round"/></svg><div class="timer-num" id="tnum">${timeLeft}</div>`;
}

function renderHome(){
  app().innerHTML=`
<div style="margin-bottom:1.5rem;padding-top:1rem">
  <h1>Med Acronym Blitz</h1>
  <p class="muted">Expand medical acronyms faster than your teammates. ${TOTAL_Q} rounds, ${Q_TIME}s each.</p>
</div>
<div class="card" style="margin-bottom:1rem">
  <p class="muted" style="margin-bottom:8px">Your name</p>
  <input class="input-field" id="pname" placeholder="e.g. Ana" maxlength="20" style="margin-bottom:16px"/>
  <div style="display:flex;gap:10px;flex-wrap:wrap">
    <button class="btn btn-primary" onclick="hostGame()"><i class="ti ti-users"></i> Host a room</button>
    <button class="btn" onclick="showJoin()"><i class="ti ti-door-enter"></i> Join a room</button>
  </div>
</div>
<div id="join-area"></div>
<div class="info-box" style="margin-top:1rem">
  <i class="ti ti-info-circle" style="font-size:14px;vertical-align:-2px;margin-right:4px"></i>
  Mix of clinical and medcomms acronyms. Partial answers accepted — first word of each term counts. Faster answers earn a speed bonus.
</div>`;
  document.getElementById("pname").addEventListener("keydown",e=>{if(e.key==="Enter")hostGame();});
}

function showJoin(){
  $("join-area").innerHTML=`
<div class="card">
  <p class="muted" style="margin-bottom:8px">Room code</p>
  <input class="input-field" id="rcode" placeholder="e.g. AB12C" maxlength="5" style="text-transform:uppercase;margin-bottom:12px"/>
  <button class="btn btn-primary" onclick="joinGame()"><i class="ti ti-door-enter"></i> Join</button>
</div>`;
  document.getElementById("rcode").addEventListener("keydown",e=>{if(e.key==="Enter")joinGame();});
}

async function initFirebase(){
  if(!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
  db = firebase.database();
}

async function hostGame(){
  const name = $("pname")?.value?.trim();
  if(!name){alert("Please enter your name first.");return;}
  await initFirebase();
  const code = generateRoom();
  state.playerName=name; state.roomCode=code; state.isHost=true;
  state.playerId="p_"+Date.now();
  state.questions=generateQuestions();
  roomRef=db.ref("rooms/"+code);
  playersRef=db.ref("rooms/"+code+"/players");
  gameRef=db.ref("rooms/"+code+"/game");
  await roomRef.set({host:state.playerId,status:"lobby",questions:state.questions,createdAt:Date.now()});
  await playersRef.child(state.playerId).set({name,score:0,joined:Date.now()});
  roomRef.onDisconnect().remove();
  listenLobby();
  renderLobby();
}

async function joinGame(){
  const name=$("pname")?.value?.trim();
  const code=$("rcode")?.value?.trim().toUpperCase();
  if(!name){alert("Please enter your name.");return;}
  if(!code||code.length<4){alert("Please enter a valid room code.");return;}
  await initFirebase();
  const snap=await db.ref("rooms/"+code).get();
  if(!snap.exists()){alert("Room not found. Check the code and try again.");return;}
  const roomData=snap.val();
  if(roomData.status==="playing"){alert("Game already in progress — wait for the next round.");return;}
  state.playerName=name; state.roomCode=code; state.isHost=false;
  state.playerId="p_"+Date.now();
  state.questions=roomData.questions;
  roomRef=db.ref("rooms/"+code);
  playersRef=db.ref("rooms/"+code+"/players");
  gameRef=db.ref("rooms/"+code+"/game");
  await playersRef.child(state.playerId).set({name,score:0,joined:Date.now()});
  listenLobby();
  renderLobby();
}

function listenLobby(){
  playersRef.on("value",snap=>{
    state.players=snap.val()||{};
    if(state.screen==="lobby") renderLobby();
  });
  gameRef.on("value",snap=>{
    const g=snap.val();
    if(!g) return;
    if(g.status==="playing"&&state.screen==="lobby"){
      state.screen="playing"; state.currentQ=0; state.score=0;
      renderQuestion();
    }
    if(g.status==="done"&&state.screen==="playing"){
      clearInterval(state.timerInterval);
      state.screen="results";
      renderResults(g.finalScores);
    }
  });
}

function renderLobby(){
  state.screen="lobby";
  const players=Object.values(state.players||{});
  app().innerHTML=`
<div style="padding-top:1rem">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:10px">
    <div>
      <h2>Lobby</h2>
      <p class="muted">Share the room code with your teammates</p>
    </div>
    <div class="room-code-display">
      <div class="label">Room code</div>
      <div class="code">${state.roomCode}</div>
    </div>
  </div>
  <div class="card" style="margin-bottom:1rem">
    <p class="muted" style="margin-bottom:10px">Players joined (${players.length})</p>
    ${players.map(p=>`
    <div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:0.5px solid rgba(0,0,0,0.08)">
      <div style="width:30px;height:30px;border-radius:50%;background:#EEEDFE;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:#3C3489;flex-shrink:0">${p.name.charAt(0).toUpperCase()}</div>
      <span style="font-size:14px">${p.name}</span>
    </div>`).join("")}
  </div>
  ${state.isHost?`
  <button class="btn btn-primary" onclick="startGame()" ${players.length<1?"disabled":""}>
    <i class="ti ti-player-play"></i> Start game (${TOTAL_Q} rounds)
  </button>
  <p class="muted" style="margin-top:8px">You can start with any number of players.</p>
  `:`<p style="font-size:14px;color:#666"><i class="ti ti-clock" style="font-size:16px;vertical-align:-2px;margin-right:4px"></i>Waiting for host to start…</p>`}
</div>`;
}

async function startGame(){
  await gameRef.set({status:"playing",startedAt:Date.now()});
}

function renderQuestion(){
  if(state.currentQ>=TOTAL_Q){endGame();return;}
  state.answered=false; state.timeLeft=Q_TIME; state.revealedChars=0;
  const q=state.questions[state.currentQ];
  const words=q.e.split(" ");

  function buildHint(revealed){
    return words.map(word=>{
      let out="";
      for(let i=0;i<word.length;i++){
        const c=word[i],isAlpha=/[a-zA-Z\-\/]/.test(c);
        out+=`<span class="hint-char${i<revealed&&isAlpha?" revealed":""}">${i<revealed&&isAlpha?c:(isAlpha?"_":c)}</span>`;
      }
      return `<span style="margin-right:6px">${out}</span>`;
    }).join("");
  }

  app().innerHTML=`
<div style="padding-top:0.5rem">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
    <span class="muted">Q ${state.currentQ+1} of ${TOTAL_Q}</span>
    <span class="badge badge-${q.cat==="clinical"?"clinical":"medcomms"}">${q.cat==="clinical"?"Clinical":"Medcomms"}</span>
  </div>
  <div class="progress-bar"><div class="progress-fill" style="width:${Math.round(state.currentQ/TOTAL_Q*100)}%"></div></div>

  <div class="card" style="margin-bottom:1rem">
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:1.25rem">
      <div class="timer-ring" id="tring">${timerArc(Q_TIME)}</div>
      <div>
        <p class="muted" style="margin-bottom:4px">Expand this acronym</p>
        <p style="font-size:34px;font-weight:500;letter-spacing:2px">${q.a}</p>
      </div>
    </div>
    <div id="hint-area" style="margin-bottom:14px;min-height:28px;font-size:14px;color:#666;line-height:2">${buildHint(0)}</div>
    <input class="input-field" id="answer-input" placeholder="Type the full expansion…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"/>
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
      <button class="btn btn-primary" onclick="submitAnswer()"><i class="ti ti-check"></i> Submit</button>
      <button class="btn" onclick="skipQuestion()"><i class="ti ti-arrow-right"></i> Skip</button>
    </div>
  </div>

  <div id="feedback-area"></div>
  <div id="live-board" style="margin-top:1rem"></div>
</div>`;

  const input=$("answer-input");
  input.focus();
  input.addEventListener("keydown",e=>{if(e.key==="Enter")submitAnswer();});
  renderLiveBoard();

  const hintAt=[7,12,17];
  state.timerInterval=setInterval(()=>{
    state.timeLeft--;
    const tring=$("tring");
    if(tring) tring.innerHTML=timerArc(state.timeLeft);
    const hIdx=hintAt.indexOf(state.timeLeft);
    if(hIdx>=0){
      state.revealedChars=(hIdx+1)*2;
      const ha=$("hint-area");
      if(ha) ha.innerHTML=buildHint(state.revealedChars);
    }
    if(state.timeLeft<=0){clearInterval(state.timerInterval);if(!state.answered)timeUp();}
  },1000);
}

function renderLiveBoard(){
  const players=Object.entries(state.players||{}).sort((a,b)=>b[1].score-a[1].score).slice(0,6);
  const lb=$("live-board");
  if(!lb) return;
  lb.innerHTML=`
<p class="muted" style="margin-bottom:6px">Live standings</p>
${players.map(([id,p],i)=>`
<div class="leaderboard-row${id===state.playerId?" my-row":""}">
  <div class="rank-badge" style="background:${i===0?"#EEEDFE":i===1?"#E1F5EE":i===2?"#FAECE7":"#f0efe8"};color:${i===0?"#3C3489":i===1?"#085041":i===2?"#712B13":"#666"}">${i+1}</div>
  <span style="flex:1;font-size:14px;font-weight:${id===state.playerId?"500":"400"}">${p.name}${id===state.playerId?" (you)":""}</span>
  <span style="font-size:14px;font-weight:500">${p.score}</span>
</div>`).join("")}`;
}

function submitAnswer(){
  if(state.answered) return;
  const input=$("answer-input");
  const val=input?.value?.trim();
  if(!val) return;
  const q=state.questions[state.currentQ];
  if(checkAnswer(val,q.e)){
    const speedBonus=state.timeLeft>15?POINTS_SPEED_BONUS:state.timeLeft>8?Math.round(POINTS_SPEED_BONUS*0.5):0;
    const pts=POINTS_BASE+speedBonus;
    state.score+=pts; state.answered=true;
    clearInterval(state.timerInterval);
    playersRef.child(state.playerId).update({score:state.score});
    $("feedback-area").innerHTML=`<div class="correct-box"><div class="label"><i class="ti ti-check" style="font-size:14px;vertical-align:-2px"></i> Correct! +${pts} pts</div><div class="value">${q.e}</div></div>`;
    setTimeout(()=>nextQuestion(),2200);
  } else {
    input.classList.add("wrong-flash");
    setTimeout(()=>input.classList.remove("wrong-flash"),400);
    $("feedback-area").innerHTML=`<p style="font-size:13px;color:#A32D2D;margin-bottom:4px"><i class="ti ti-x" style="font-size:14px;vertical-align:-2px"></i> Not quite — keep trying or skip.</p>`;
  }
}

function timeUp(){
  state.answered=true;
  const q=state.questions[state.currentQ];
  $("feedback-area").innerHTML=`<div class="wrong-box"><div class="label"><i class="ti ti-clock" style="font-size:14px;vertical-align:-2px"></i> Time's up</div><div class="value">${q.e}</div></div>`;
  setTimeout(()=>nextQuestion(),2200);
}

function skipQuestion(){
  if(state.answered) return;
  clearInterval(state.timerInterval);
  const q=state.questions[state.currentQ];
  state.answered=true;
  $("feedback-area").innerHTML=`<div class="wrong-box"><div class="label">Skipped</div><div class="value">${q.e}</div></div>`;
  setTimeout(()=>nextQuestion(),2000);
}

function nextQuestion(){
  state.currentQ++;
  state.currentQ>=TOTAL_Q?endGame():renderQuestion();
}

async function endGame(){
  clearInterval(state.timerInterval);
  const snap=await playersRef.get();
  const allPlayers=snap.val()||{};
  const finalScores=Object.fromEntries(Object.entries(allPlayers).sort((a,b)=>b[1].score-a[1].score));
  if(state.isHost){
    await gameRef.update({status:"done",finalScores});
  } else {
    state.screen="results";
    renderResults(finalScores);
  }
}

function renderResults(finalScores){
  state.screen="results";
  clearInterval(state.timerInterval);
  const entries=Object.entries(finalScores||state.players||{}).sort((a,b)=>b[1].score-a[1].score);
  const myRank=entries.findIndex(([id])=>id===state.playerId)+1;
  const myScore=entries.find(([id])=>id===state.playerId)?.[1]?.score??state.score;
  const medals=["#EEEDFE","#E1F5EE","#FAECE7"];
  const medalText=["#26215C","#04342C","#4A1B0C"];
  app().innerHTML=`
<div style="padding-top:1rem">
  <div style="margin-bottom:1.25rem">
    <h1>Game over</h1>
    <p class="muted">Your score: <strong>${myScore} pts</strong> — Rank #${myRank} of ${entries.length}</p>
  </div>
  <div class="card" style="margin-bottom:1rem">
    <p class="muted" style="margin-bottom:10px">Final standings</p>
    ${entries.map(([id,p],i)=>`
    <div class="leaderboard-row${id===state.playerId?" my-row":""}">
      <div class="rank-badge" style="background:${i<3?medals[i]:"#f0efe8"};color:${i<3?medalText[i]:"#666"}">${i+1}</div>
      <span style="flex:1;font-size:14px;font-weight:${id===state.playerId?"500":"400"}">${p.name}${id===state.playerId?" &#9733;":""}</span>
      <span style="font-size:14px;font-weight:500">${p.score} pts</span>
    </div>`).join("")}
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    ${state.isHost?`<button class="btn btn-primary" onclick="playAgain()"><i class="ti ti-refresh"></i> Play again</button>`:""}
    <button class="btn" onclick="goHome()"><i class="ti ti-home"></i> Home</button>
  </div>
</div>`;
}

async function playAgain(){
  const newQs=generateQuestions();
  state.questions=newQs; state.score=0; state.currentQ=0;
  const snap=await playersRef.get();
  const updates={};
  Object.keys(snap.val()||{}).forEach(id=>{updates[id+"/score"]=0;});
  await playersRef.update(updates);
  await roomRef.update({questions:newQs,status:"lobby"});
  await gameRef.set({status:"lobby"});
  state.screen="lobby";
  renderLobby();
}

function goHome(){
  if(roomRef) roomRef.off();
  if(playersRef) playersRef.off();
  if(gameRef) gameRef.off();
  clearInterval(state.timerInterval);
  state={screen:"home",playerName:"",roomCode:"",isHost:false,playerId:null,questions:[],currentQ:0,score:0,answered:false,timerInterval:null,timeLeft:Q_TIME,revealedChars:0,players:{}};
  renderHome();
}

setInterval(()=>{if(state.screen==="playing") renderLiveBoard();},3000);

renderHome();
</script>
</body>
</html>
